<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171816">
  <title>Color Study — a keyboard color-match game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171816;
      color: #f2f0e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #aaa99f;
      --line: #44453f;
      --acid: #d1fb73;
      --panel: #20211e;
    }

    * { box-sizing: border-box; }
    body { width: 100%; min-width: 320px; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; background: #171816; }
    body:focus { outline: none; }
    main { position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #171816; touch-action: none; }
    .canvas { position: absolute; inset: 0; overflow: hidden; background: #171816; --split: 50%; }
    .canvas img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    #original-image { z-index: 0; }
    .tuned-window { position: absolute; z-index: 1; inset: 0; overflow: hidden; clip-path: inset(0 0 0 var(--split)); transition: clip-path 100ms ease-out; }
    .split-guide { position: absolute; z-index: 3; top: 0; bottom: 0; left: var(--split); width: 2px; transform: translateX(-50%); background: rgba(255, 255, 255, .88); box-shadow: 0 0 14px rgba(0, 0, 0, .5); pointer-events: none; transition: left 100ms ease-out; }
    .stage.dragging-split .tuned-window, .stage.dragging-split .split-guide { transition: none; }
    .split-handle { position: absolute; top: 50%; left: 50%; display: grid; width: 38px; height: 38px; place-items: center; transform: translate(-50%, -50%); border: 1px solid rgba(255, 255, 255, .8); border-radius: 50%; color: white; background: rgba(20, 21, 19, .78); font-size: 17px; }
    .float-panel { position: absolute; z-index: 5; border: 1px solid rgba(255, 255, 255, .16); border-radius: 10px; background: rgba(23, 24, 22, .82); box-shadow: 0 12px 38px rgba(0, 0, 0, .24); backdrop-filter: blur(16px); }
    .level-info { position: absolute; z-index: 5; right: 22px; bottom: 22px; max-width: min(430px, calc(100vw - 180px)); color: #fff; text-align: right; text-shadow: 0 2px 14px rgba(0, 0, 0, .85); }
    .level-title { margin: 0; font-size: clamp(38px, 5vw, 62px); font-weight: 800; line-height: .98; letter-spacing: .02em; }
    .level-goal { margin: 8px 0 0; font-size: 13px; }
    .level-timer { position: absolute; z-index: 6; top: 22px; left: 50%; margin: 0; transform: translateX(-50%); color: #f0efe8; font-size: 3.5rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 2px 14px rgba(0, 0, 0, .85); }
    .level-source { display: inline-block; margin-top: 7px; color: #f0efe8; font-size: 9px; letter-spacing: .1em; text-decoration-color: rgba(255,255,255,.7); text-underline-offset: 3px; text-transform: uppercase; }
    .side-tag { position: absolute; z-index: 4; top: 22px; padding: 8px 11px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; color: white; background: rgba(20, 21, 19, .65); font-size: 9px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; pointer-events: none; }
    .original-tag { left: 22px; }
    .joystick-note, #allow-joystick { position: absolute; z-index: 7; left: 22px; }
    .joystick-note { top: 108px; max-width: 260px; margin: 0; color: #f0efe8; font-size: 12px; text-shadow: 0 2px 14px rgba(0, 0, 0, .85); }
    #allow-joystick { top: 64px; padding: 8px 11px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; color: white; background: rgba(20, 21, 19, .65); font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .joystick-note[hidden], #allow-joystick[hidden] { display: none; }
    .tuned-tag { right: 22px; }
    .image-fallback { position: absolute; z-index: 4; inset: 0; display: grid; place-items: center; padding: 24px; color: #f2f0e9; background: rgba(20, 21, 19, .88); font-size: 14px; text-align: center; }
    .image-fallback[hidden] { display: none; }
    .tuning { bottom: 22px; left: 22px; width: 170px; padding: 9px 11px; }
    .score-emojis { color: var(--acid); font-size: 22px; line-height: 1; white-space: nowrap; }
    #message { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 700px) {
      .level-info { right: 12px; bottom: 12px; max-width: calc(100vw - 170px); }
      .original-tag { left: 12px; }
      .tuned-tag { right: 12px; }
      .tuning { bottom: 12px; left: 12px; padding: 9px 10px; }
    }

    @media (max-width: 440px) {
      .level-info { max-width: calc(100vw - 180px); }
      .level-title { font-size: clamp(24px, 7vw, 30px); }
      .level-goal { font-size: 11px; }
      .tuning { padding: 9px; }
    }

    @media (max-height: 650px) and (min-width: 701px) {
      .tuning { bottom: 12px; }
      .side-tag { top: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tuned-window, .split-guide { transition: none; }
    }
</style>
</head>
<body tabindex="0">
  <main class="stage">
    <section class="canvas" aria-label="Original photo on the left, tuned photo on the right">
      <img id="original-image" alt="Original CreativeHK photograph" decoding="async">
      <div class="tuned-window"><img id="tuned-image" alt="The same photograph with your hue, saturation, and lightness adjustments" decoding="async"></div>
      <div class="split-guide" aria-hidden="true"><span class="split-handle">↔</span></div>
      <span class="side-tag original-tag">Original</span>
      <span class="side-tag tuned-tag">Tuning</span>
      <div class="image-fallback" id="image-fallback" role="status" hidden>Image unavailable. Check your internet connection and reload.</div>
    </section>
    <p class="level-timer"><span id="stage-timer">00:59</span></p>
    <button type="button" id="allow-joystick" hidden>Allow joystick</button>
    <p id="joystick-status" class="joystick-note" role="status" hidden></p>

    <section class="level-info" aria-label="Current level">
      <h1 class="level-title">關卡 #<span id="level-number">1</span></h1>
      <p class="level-goal">調整相片直至相似度達 95%</p>
      <a class="level-source" href="https://www.creativehk.edu.hk/" target="_blank" rel="noopener noreferrer">Image source · CreativeHK</a>
    </section>

    <section class="tuning float-panel" aria-label="Match rating">
      <div class="score-emojis" id="score-value" role="img" aria-label="50% match">🐭🐭🐭🐭🐭</div>
      <p id="message" role="status" aria-live="polite">Color match updated.</p>
    </section>
  </main>

  <script src="joystick.js"></script>
  <script src="central-client.js"></script>
  <script>
    const images = [
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4015571178714403489.webp', caption: 'School volleyball · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4010448831913228017.webp', caption: 'Beach volleyball · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4013348841663313305.jpg', caption: 'Art exhibition · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4013505767495918965.webp', caption: 'School basketball · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4012019490690778221.webp', caption: 'Creative film visit · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4011773240712339459.webp', caption: 'Dunhuang study tour · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4011284848949975254.webp', caption: 'Outdoor volleyball · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4009203920534737778.webp', caption: 'Island field trip · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4009116567384301493.webp', caption: 'Climbing activity · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4009042070345970752.webp', caption: 'Beach cleanup · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4008907981415591392.webp', caption: 'School excursion · CreativeHK' },
      { src: 'https://www.creativehk.edu.hk/images/instagram/instagram_hksc_official_4006114497890051393.webp', caption: 'Dunhuang field trip · CreativeHK' },
      { src: 'https://a.storyblok.com/f/246847/1334x1334/6e0617894a/dsc00535.webp', caption: 'Hands-on design workshop · CreativeHK' },
      { src: 'https://a.storyblok.com/f/246847/2102x1402/1622733f17/dsc02505_-1.webp', caption: 'Gallery movement workshop · CreativeHK' },
      { src: 'https://a.storyblok.com/f/246847/3976x2652/121f8009e4/dsc09106-1.webp', caption: 'Studio critique · CreativeHK' }
    ];
    for (let i = images.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [images[i], images[j]] = [images[j], images[i]];
    }
    const channels = ['hue', 'saturation', 'lightness'];
    const steps = { hue: 5, saturation: 0.1, lightness: 0.05 };
    const bounds = { hue: [-180, 180], saturation: [0.4, 2], lightness: [0.55, 1.45] };
    const stage = document.querySelector('.canvas');
    const originalImage = document.querySelector('#original-image');
    const tunedImage = document.querySelector('#tuned-image');
    const message = document.querySelector('#message');
    const central = createCentralClient("dvc");
    let roundsCleared = 0;
    let round = 0;
    let selected = 0;
    let split = 50;
    let advanceTimer = 0;
    let countdownInterval = 0;
    let stageDeadline = 0;
    let player;

    const randomStep = (min, max, step) => Number((min + Math.floor(Math.random() * ((max - min) / step + 1)) * step).toFixed(2));

    // shortcut: lightness uses CSS brightness; use a same-origin pixel transform when exact HSL is required.
    function filterFor(color) {
      return `hue-rotate(${color.hue}deg) saturate(${color.saturation}) brightness(${color.lightness})`;
    }


    function matchState() {
      const hueError = Math.abs(player.hue);
      const saturationError = Math.abs(player.saturation - 1);
      const lightnessError = Math.abs(player.lightness - 1);
      const score = Math.max(0, Math.round(100 * (1 - 0.4 * hueError / 180 - 0.3 * saturationError / 1.6 - 0.3 * lightnessError / 0.9)));
      return { score, matched: score >= 95 };
    }

    function render() {
      tunedImage.style.filter = filterFor(player);
      stage.style.setProperty('--split', `${split}%`);
      const { score } = matchState();
      const cheeseCount = Math.max(0, Math.min(5, Math.floor((score - 50) / 10)));
      const mouseCount = 5 - cheeseCount;
      const badge = document.querySelector('#score-value');
      badge.textContent = `${'🧀'.repeat(cheeseCount)}${'🐭'.repeat(mouseCount)}`;
      badge.setAttribute('aria-label', `${score}% match, ${mouseCount} mice and ${cheeseCount} cheese`);
      document.querySelector('#level-number').textContent = String(round + 1);
      const timer = document.querySelector('#stage-timer').textContent;
      const update = `Level ${round + 1} · ${score}% match · ${timer}`;
      central.status({
        phase: 'live',
        score,
        update,
        summary: update,
        detail: { level: round + 1, match: `${score}%`, timer, cleared: roundsCleared }
      });
    }

    function setMessage(text, kind = '') {
      message.className = kind;
      message.textContent = text;
    }

    function startRound(index) {
      if (advanceTimer) clearTimeout(advanceTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      advanceTimer = 0;
      countdownInterval = 0;
      round = index % images.length;
      selected = 0;
      split = 50;
      player = {
        hue: randomStep(30, 120, 5) * (Math.random() < 0.5 ? -1 : 1),
        saturation: randomStep(0.4, 1.8, 0.1),
        lightness: randomStep(0.65, 1.4, 0.05)
      };
      const image = images[round];
      document.querySelector('#image-fallback').hidden = true;
      originalImage.src = image.src;
      tunedImage.src = image.src;
      originalImage.alt = `Original photo: ${image.caption}`;
      tunedImage.alt = `Tuned photo: ${image.caption}`;
      stageDeadline = Date.now() + 59_000;
      const timer = document.querySelector('#stage-timer');
      timer.textContent = '00:59';
      countdownInterval = setInterval(() => {
        const seconds = Math.max(0, Math.ceil((stageDeadline - Date.now()) / 1000));
        timer.textContent = `00:${String(seconds).padStart(2, '0')}`;
        if (seconds === 0) startRound(round + 1);
      }, 250);
      render();
      const { score } = matchState();
      setMessage(`${score}% match · tune the right side to the original.`);
    }

    function adjust(channel, direction) {
      const [min, max] = bounds[channel];
      const precision = channel === 'saturation' ? 1 : channel === 'lightness' ? 2 : 0;
      player[channel] = Number(Math.max(min, Math.min(max, player[channel] + direction * steps[channel])).toFixed(precision));
      render();
      const { score, matched } = matchState();
      if (matched) {
        setMessage(round === images.length - 1 ? `All ${images.length} images matched · starting a new set…` : 'Match found · loading the next image…', 'success');
        if (!advanceTimer) {
          roundsCleared += 1;
          central.signal({
            reason: 'round',
            phase: 'clear',
            score,
            update: `Level ${round + 1} matched · ${score}%`,
            summary: `Level ${round + 1} matched · ${score}%`,
            detail: { level: round + 1, match: `${score}%`, cleared: roundsCleared }
          });
          advanceTimer = setTimeout(() => startRound(round + 1), 1000);
        }
      } else {
        if (advanceTimer) clearTimeout(advanceTimer);
        advanceTimer = 0;
        setMessage(`${score}% match · tune the right side to the original.`);
      }
    }

    function applyKey(key) {
      if (key === 'ArrowLeft' || key === 'ArrowRight') {
        split = Math.max(2, Math.min(98, split + (key === 'ArrowRight' ? 2 : -2)));
        render();
      } else if (key === 'ArrowUp' || key === 'ArrowDown') {
        adjust(channels[selected], key === 'ArrowUp' ? 1 : -1);
      } else if (key === ' ') {
        selected = (selected + 1) % channels.length;
        render();
      }
    }

    window.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) return;
      event.preventDefault();
      applyKey(event.key);
    });

    const gameRoot = document.querySelector('.stage');
    let touchGesture = null;

    gameRoot.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch' || !event.isPrimary || event.target.closest('a')) return;
      touchGesture = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, lastX: event.clientX, lastY: event.clientY, pendingY: 0, axis: null };
    });

    gameRoot.addEventListener('pointermove', event => {
      if (!touchGesture || event.pointerId !== touchGesture.pointerId) return;
      const totalX = event.clientX - touchGesture.startX;
      const totalY = event.clientY - touchGesture.startY;
      if (!touchGesture.axis) {
        if (Math.hypot(totalX, totalY) < 8) return;
        touchGesture.axis = Math.abs(totalX) > Math.abs(totalY) ? 'horizontal' : 'vertical';
        if (touchGesture.axis === 'horizontal') gameRoot.classList.add('dragging-split');
      }
      if (touchGesture.axis === 'horizontal') {
        split = Math.max(2, Math.min(98, split + (event.clientX - touchGesture.lastX) / gameRoot.clientWidth * 100));
        render();
      } else {
        touchGesture.pendingY += event.clientY - touchGesture.lastY;
        const steps = Math.trunc(Math.abs(touchGesture.pendingY) / 24);
        if (steps) {
          const direction = touchGesture.pendingY < 0 ? 1 : -1;
          for (let i = 0; i < steps; i += 1) adjust(channels[selected], direction);
          touchGesture.pendingY += direction * steps * 24;
        }
      }
      touchGesture.lastX = event.clientX;
      touchGesture.lastY = event.clientY;
    });

    gameRoot.addEventListener('pointerup', event => {
      if (!touchGesture || event.pointerId !== touchGesture.pointerId) return;
      if (!touchGesture.axis) {
        selected = (selected + 1) % channels.length;
        render();
      }
      gameRoot.classList.remove('dragging-split');
      touchGesture = null;
    });

    gameRoot.addEventListener('pointercancel', event => {
      if (touchGesture && event.pointerId === touchGesture.pointerId) {
        gameRoot.classList.remove('dragging-split');
        touchGesture = null;
      }
    });

    [originalImage, tunedImage].forEach(image => {
      image.addEventListener('error', () => {
        document.querySelector('#image-fallback').hidden = false;
        setMessage('A CreativeHK image could not load. Check your connection and reload.', 'error');
      });
    });

    document.body.focus({ preventScroll: true });
    startRound(0);

    const joystickNote = document.querySelector('#joystick-status');
    const allowJoystick = document.querySelector('#allow-joystick');
    const serialState = { buffer: '', held: '' };
    const joy = createJoystick({
      onText(chunk) {
        for (const event of readJoystickLines(serialState, chunk)) {
          if (event.key && !event.up) applyKey(event.key);
        }
      },
      onStatus(kind, message) {
        const connected = kind === 'connected';
        joystickNote.hidden = allowJoystick.hidden = connected;
        joystickNote.textContent = message || {
          'needs-permission': 'Click Allow joystick once. After that it connects on its own.',
          disconnected: 'Joystick disconnected.',
          error: 'Joystick error.'
        }[kind] || '';
      }
    });
    allowJoystick.addEventListener('click', () => {
      joy.requestPort();
    });
    window.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key !== 'c' && event.key !== 'C') return;
      event.preventDefault();
      joy.disconnect().finally(() => { location.href = 'console.html?map=1'; });
    });
    joy.autoConnect();
  </script>
</body>
</html>
